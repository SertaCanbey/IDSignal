name: idsignal

services:
  idsignal:
    build: .
    image: idsignal:latest
    container_name: idsignal
    restart: unless-stopped
    ports:
      - "4317:4317"
    environment:
      - PORT=4317
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - APP_ORIGIN=http://localhost:4317
    volumes:
      - idsignal_data:/app/data

volumes:
  idsignal_data:
    driver: local
